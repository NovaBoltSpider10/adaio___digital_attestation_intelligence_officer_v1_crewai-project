intake_payload_validation:
  description: >
    Review the applicant information contained in the following case data payload: 
    {case_data}
    
    1. Extract the "request" object from it. Verify that all required applicant fields are present: name, nationality, id_number.
    2. Verify required request fields: service_type, document_refs, channel.
    3. FOR EVERY document reference listed in "document_refs", YOU MUST call the 
       "Verify Document Existence" tool with the document's doc_id / file path to verify it exists on the server.
    4. Verify that the number of document entries in "document_refs" is greater than 0. If "document_refs" is empty, set status = "incomplete" and add "document_refs" to missing_fields.
    5. If any required field is missing OR if any document verification tool call returns an ERROR / 404, 
       set status = "incomplete" and list the missing/invalid items under missing_fields.
  expected_output: "Return ONLY valid JSON matching the IntakeResult schema."
  agent: intake_validation_agent

document_analysis_task:
  description: >
    Review the following case data payload: {case_data}
    
    1. Locate the "extracted_raw_text" dictionary inside the payload, which contains text content and preliminary quality assessments for each document.
    2. Extract document metadata, doc_type, and critical identity fields. 
    3. For every extracted field, assign a confidence score (float between 0.0 and 1.0).
    4. Construct a strict "quality_assessment" dict containing:
       - "legibility": (string: "high", "medium", or "low")
       - "flags": (list of detected flag strings/anomalies)
    
    FORMATTING RULES:
    - Return a JSON object with a single root key: "documents".
    - "documents" must be a list of objects matching the DocumentAnalysisResult schema strictly.
    - Each document object MUST include the populated "quality_assessment" dictionary for downstream risk and verification agents.
    - Do not output any preamble or markdown formatting outside of the JSON structure.
  expected_output: "Return ONLY valid JSON matching the DocumentAnalysisResult schema."
  agent: document_analysis_agent

verification_task:
  description: >
    You are the Verification Officer. Your task is to reconcile the 'request' data 
    provided by the applicant with the 'extracted_fields' from the processed documents.
    
    1. Access the 'request' object from the {case_data}.
    2. Access the 'document_analysis_result' from the {case_data}.
    3. Compare fields: 'name', 'nationality', and 'id_number'. (If a field is missing from the extracted document data, set extracted_value to 'NOT_FOUND' or an empty string instead of null.)
    4. For each field:
       - If the value in 'request' matches the 'value' in 'extracted_fields', set match = true.
       - If they differ, set match = false.
    5. 'source' should be labeled as "internal_intake_reconciliation".
    
    Ensure the output matches the VerificationResult schema strictly.
    
  expected_output: "A JSON object containing the list of checks, unverifiable_fields, and the overall_match_rate."
  agent: verification_agent

risk_assessment_task:
  description: >
    Review the full dossier: {case_data}.
    
    1. Duplicate Check: 
       - You have access to the 'case_id' inside the {case_data} JSON.
       - Use 'Case Log Search' with query={applicant.id_number} and query_type='id_number'.
       - If the result returns a list containing IDs other than the 'case_id' from the payload, set 'duplicate' detected = true.
    2. Blacklist Check: Perform a simulated check. If 'id_number' matches 
       '0000000000', set blacklist_match detected = true.
    3. Tampering Heuristic: Flag 'document_tampering_signal' detected = true 
       if 'document_analysis_result.documents' contains any flags in quality_assessment.
    4. Compute a 'risk_score' (0-100) and 'risk_level' (low/medium/high).
    
    You MUST return the output following the exact structure of the RiskResult schema.
  expected_output: "Return ONLY valid JSON matching the RiskResult schema."
  agent: risk_assessment_agent

decision_recommendation_task:
  description: >
    Review the following case dossier payload: {case_data}
    
    1. Extract the "case_id" from the root of the JSON payload. 
       You MUST use this exact case_id when executing the case_log_search tool. Do not use placeholder text.
    
    2. Analyze all evidence across the dossier using these STRICT decision rules:
       - IF risk_level is 'high' OR risk_score > 50 -> recommendation MUST be 'reject'.
       - IF overall_match_rate < 0.80 OR unverifiable_fields is not empty -> recommendation MUST be 'manual_review'.
       - IF risk_level is 'low' AND overall_match_rate >= 0.80 AND no critical field mismatches exist -> recommendation MAY be 'approve'.
    
    3. In your output rationale:
       - Explicitly mention the `overall_match_rate` and list any failed checks (e.g., fields marked match=false or NOT_FOUND).
       - Explain clearly why the decision rules led to your recommended action. Do not ignore missing or failed verification checks.
       
    4. You must map the `calculated_score` provided in the {case_data} payload exactly into the `confidence_score` field in your output. Do not calculate this yourself.

  expected_output: "Return ONLY valid JSON matching the DecisionResult schema."
  agent: decision_support_agent

notification_task:
  description: >
    Review the case state and output from the payload: {case_data}
    
    1. IF state == 'AWAITING_INFO' or intake_result.status == 'incomplete':
       Generate a notification requesting the applicant submit missing fields: {intake_result.missing_fields}.
    2. IF decision_result.recommendation == 'approve':
       Generate an official Approval Notice.
    3. IF decision_result.recommendation == 'reject':
       Generate a polite Rejection Notice summarizing rationale.
    4. IF decision_result.recommendation == 'manual_review':
       Generate an Acknowledgement Notice stating the application is under human review.
    5. You must output the full text of the generated notification into the `message_body` field.
  expected_output: "Return ONLY valid JSON matching the CommunicationResult schema."
  agent: communication_agent